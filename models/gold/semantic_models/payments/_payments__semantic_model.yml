semantic_models:
  - name: fct_payments
    description: >
      Semantic model for the payment fact table. Grain is one row per
      payment (charge, refund, or payout).
    model: ref('fct_payments')
    defaults:
      agg_time_dimension: payment_date

    entities:
      - name: payment_id
        type: primary
        expr: PAYMENT_ID
      - name: booking_id
        type: foreign
        expr: BOOKING_ID
      - name: host_id
        type: foreign
        expr: HOST_ID
      - name: guest_id
        type: foreign
        expr: GUEST_ID

    dimensions:
      - name: payment_date
        type: time
        expr: PAYMENT_DATE
        type_params:
          time_granularity: day
      - name: payment_type
        type: categorical
        expr: PAYMENT_TYPE
      - name: payment_status
        type: categorical
        expr: PAYMENT_STATUS
      - name: payment_status_group
        type: categorical
        expr: PAYMENT_STATUS_GROUP

    measures:
      - name: payment_amount_sum
        description: Sum of payment amounts, across all payment types and statuses.
        agg: sum
        expr: PAYMENT_AMOUNT
      - name: payment_count
        description: Count of payment transactions.
        agg: count
        expr: PAYMENT_ID
      - name: gross_charge_amount
        description: Sum of successfully completed guest charges.
        agg: sum
        expr: CASE WHEN PAYMENT_TYPE = 'charge' AND PAYMENT_STATUS_GROUP = 'SUCCESS' THEN PAYMENT_AMOUNT ELSE 0 END
      - name: refund_amount
        description: Sum of successfully processed refunds paid back to guests.
        agg: sum
        expr: CASE WHEN PAYMENT_TYPE = 'refund' AND PAYMENT_STATUS_GROUP = 'SUCCESS' THEN PAYMENT_AMOUNT ELSE 0 END
      - name: payout_amount
        description: Sum of successfully completed host payouts.
        agg: sum
        expr: CASE WHEN PAYMENT_TYPE = 'payout' AND PAYMENT_STATUS_GROUP = 'SUCCESS' THEN PAYMENT_AMOUNT ELSE 0 END
      - name: failed_payment_count
        description: Count of payment transactions that failed.
        agg: count
        expr: CASE WHEN PAYMENT_STATUS_GROUP = 'FAILED' THEN PAYMENT_ID END
