semantic_models:
  - name: fct_bookings
    description: >
      Semantic model for the booking fact table. Grain is one row per booking.
    model: ref('fct_bookings')
    defaults:
      agg_time_dimension: booking_date

    entities:
      - name: booking_id
        type: primary
        expr: BOOKING_ID
      - name: listing_id
        type: foreign
        expr: LISTING_ID
      - name: host_id
        type: foreign
        expr: HOST_ID

    dimensions:
      - name: booking_date
        type: time
        expr: BOOKING_DATE
        type_params:
          time_granularity: day
      - name: property_type
        type: categorical
        expr: PROPERTY_TYPE
      - name: room_type
        type: categorical
        expr: ROOM_TYPE
      - name: city
        type: categorical
        expr: CITY
      - name: country
        type: categorical
        expr: COUNTRY
      - name: host_name
        type: categorical
        expr: HOST_NAME
      - name: is_superhost
        type: categorical
        expr: IS_SUPERHOST
      - name: booking_status
        type: categorical
        expr: BOOKING_STATUS

    measures:
      - name: total_amount
        description: Sum of booking total amounts.
        agg: sum
        expr: TOTAL_AMOUNT
      - name: service_fee_amount
        description: Sum of service fees.
        agg: sum
        expr: SERVICE_FEE
      - name: cleaning_fee_amount
        description: Sum of cleaning fees.
        agg: sum
        expr: CLEANING_FEE
      - name: booking_count
        description: Count of bookings.
        agg: count
        expr: BOOKING_ID
      - name: cancelled_booking_count
        description: Count of bookings with a cancelled status.
        agg: count
        expr: BOOKING_ID
