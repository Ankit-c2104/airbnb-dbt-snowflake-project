version: 2

models:
  - name: fct_reviews
    description: >
      Fact table at review grain. One row per review, with review measures
      plus listing, host, and guest attributes.
    columns:
      - name: REVIEW_ID
        description: Primary key. Unique identifier for a review.
        tests:
          - unique
          - not_null

      - name: BOOKING_ID
        description: Foreign key to the related booking.
        tests:
          - relationships:
              arguments:
                to: ref('silver_bookings')
                field: BOOKING_ID

      - name: LISTING_ID
        description: Foreign key to silver_listings.
        tests:
          - relationships:
              arguments:
                to: ref('silver_listings')
                field: LISTING_ID

      - name: HOST_ID
        description: Foreign key to silver_hosts.
        tests:
          - relationships:
              arguments:
                to: ref('silver_hosts')
                field: HOST_ID

      - name: GUEST_ID
        description: Foreign key to silver_guests.
        tests:
          - relationships:
              arguments:
                to: ref('silver_guests')
                field: GUEST_ID

      - name: REVIEW_DATE
        description: Date the review was submitted.

      - name: OVERALL_RATING
        description: Overall rating given in the review (1-5).

      - name: SENTIMENT
        description: Derived sentiment of the review (positive / neutral / negative).

      - name: PROPERTY_TYPE
        description: Type of property reviewed (from silver_listings).

      - name: ROOM_TYPE
        description: Room type reviewed (from silver_listings).

      - name: CITY
        description: City of the reviewed listing (from silver_listings).

      - name: COUNTRY
        description: Country of the reviewed listing (from silver_listings).

      - name: HOST_NAME
        description: Host name (from silver_hosts).

      - name: GUEST_NAME
        description: Guest name (from silver_guests).

      - name: CREATED_AT
        description: Timestamp the review record was created.
