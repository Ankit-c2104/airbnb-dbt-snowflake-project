version: 2

models:
  - name: fct_payments
    description: >
      Fact table at payment grain. One row per payment (charge, refund, or
      payout), with payment measures plus host and guest attributes.
    columns:
      - name: PAYMENT_ID
        description: Primary key. Unique identifier for a payment transaction.
        tests:
          - unique
          - not_null

      - name: BOOKING_ID
        description: Foreign key to the related booking.
        tests:
          - relationships:
              arguments:
                to: ref('silver_bookings')
                field: BOOKING_ID

      - name: HOST_ID
        description: Foreign key to silver_hosts.
        tests:
          - relationships:
              arguments:
                to: ref('silver_hosts')
                field: HOST_ID

      - name: GUEST_ID
        description: Foreign key to silver_guests. Null for payout rows.
        tests:
          - relationships:
              arguments:
                to: ref('silver_guests')
                field: GUEST_ID

      - name: PAYMENT_DATE
        description: Date the payment occurred.

      - name: PAYMENT_TYPE
        description: Type of payment (charge / refund / payout).

      - name: PAYMENT_STATUS
        description: Raw payment status (completed / pending / failed).

      - name: PAYMENT_STATUS_GROUP
        description: Normalized payment status bucket (SUCCESS / FAILED / PENDING).

      - name: PAYMENT_AMOUNT
        description: Amount of the payment transaction.

      - name: HOST_NAME
        description: Host name (from silver_hosts).

      - name: GUEST_NAME
        description: Guest name (from silver_guests).

      - name: CREATED_AT
        description: Timestamp the payment record was created.

semantic_models:
  - name: fct_payments
    description: >
      Semantic model for the payment fact table. Grain is one row per
      payment (charge, refund, or payout).
    model: ref('fct_payments')
    defaults:
      agg_time_dimension: payment_date

    entities:
      - name: payment_id
        type: primary
        expr: PAYMENT_ID
      - name: booking_id
        type: foreign
        expr: BOOKING_ID
      - name: host_id
        type: foreign
        expr: HOST_ID
      - name: guest_id
        type: foreign
        expr: GUEST_ID

    dimensions:
      - name: payment_date
        type: time
        expr: PAYMENT_DATE
        type_params:
          time_granularity: day
      - name: payment_type
        type: categorical
        expr: PAYMENT_TYPE
      - name: payment_status
        type: categorical
        expr: PAYMENT_STATUS
      - name: payment_status_group
        type: categorical
        expr: PAYMENT_STATUS_GROUP

    measures:
      - name: payment_amount_sum
        description: Sum of payment amounts, across all payment types and statuses.
        agg: sum
        expr: PAYMENT_AMOUNT
      - name: payment_count
        description: Count of payment transactions.
        agg: count
        expr: PAYMENT_ID
      - name: gross_charge_amount
        description: Sum of successfully completed guest charges.
        agg: sum
        expr: CASE WHEN PAYMENT_TYPE = 'charge' AND PAYMENT_STATUS_GROUP = 'SUCCESS' THEN PAYMENT_AMOUNT ELSE 0 END
      - name: refund_amount
        description: Sum of successfully processed refunds paid back to guests.
        agg: sum
        expr: CASE WHEN PAYMENT_TYPE = 'refund' AND PAYMENT_STATUS_GROUP = 'SUCCESS' THEN PAYMENT_AMOUNT ELSE 0 END
      - name: payout_amount
        description: Sum of successfully completed host payouts.
        agg: sum
        expr: CASE WHEN PAYMENT_TYPE = 'payout' AND PAYMENT_STATUS_GROUP = 'SUCCESS' THEN PAYMENT_AMOUNT ELSE 0 END
      - name: failed_payment_count
        description: Count of payment transactions that failed.
        agg: count
        expr: CASE WHEN PAYMENT_STATUS_GROUP = 'FAILED' THEN PAYMENT_ID END
