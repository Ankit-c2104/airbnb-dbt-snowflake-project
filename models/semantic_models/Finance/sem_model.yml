semantic_models:
  - name: fact
    description: >
      Booking-grain fact table combining booking financials with
      listing and host attributes.
    model: ref('fact')

    entities:
      - name: booking_id
        type: primary
      - name: listing_id
        type: foreign
      - name: host_id
        type: foreign

    dimensions:
      - name: accommodates
        type: categorical
      - name: bedrooms
        type: categorical
      - name: bathrooms
        type: categorical
      - name: booking_date
        type: time
        type_params:
          time_granularity: day

    measures:
      - name: total_amount
        description: Total amount charged for the booking.
        agg: sum
        expr: total_amount
        agg_time_dimension: booking_date
      - name: service_fee
        description: Service fee charged on the booking.
        agg: sum
        expr: service_fee
        agg_time_dimension: booking_date
      - name: cleaning_fee
        description: Cleaning fee charged on the booking.
        agg: sum
        expr: cleaning_fee
        agg_time_dimension: booking_date
      - name: booking_count
        description: Count of bookings.
        agg: count
        expr: booking_id
        agg_time_dimension: booking_date

  - name: listings
    description: >
      Listing-grain dimension table.
    model: ref('silver_listings')

    entities:
      - name: listing_id
        type: primary

    dimensions:
      - name: created_at
        type: time
        type_params:
          time_granularity: day

    measures:
      - name: price_per_night
        description: Average nightly price of the listing.
        agg: average
        expr: price_per_night
        agg_time_dimension: created_at

  - name: hosts
    description: >
      Host-grain dimension table.
    model: ref('silver_hosts')

    entities:
      - name: host_id
        type: primary

    dimensions:
      - name: created_at
        type: time
        type_params:
          time_granularity: day

    measures:
      - name: response_rate
        description: Average host response rate.
        agg: average
        expr: response_rate
        agg_time_dimension: created_at