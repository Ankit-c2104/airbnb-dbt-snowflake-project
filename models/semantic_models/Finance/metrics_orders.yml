metrics:
  - name: total_revenue
    description: Sum of total booking amount.
    type: simple
    type_params:
      measure: total_amount

  - name: total_service_fee
    description: Sum of service fees collected.
    type: simple
    type_params:
      measure: service_fee

  - name: total_cleaning_fee
    description: Sum of cleaning fees collected.
    type: simple
    type_params:
      measure: cleaning_fee

  - name: avg_price_per_night
    description: Average nightly listing price.
    type: simple
    type_params:
      measure: price_per_night

  - name: avg_response_rate
    description: Average host response rate.
    type: simple
    type_params:
      measure: response_rate

  - name: total_bookings
    description: Total number of bookings.
    type: simple
    type_params:
      measure: booking_count

  - name: revenue_per_booking
    description: Average revenue generated per booking.
    type: ratio
    type_params:
      numerator: total_revenue
      denominator: total_bookings
